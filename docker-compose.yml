services:
  key-tester:
    build:
      context: .
    image: key-tester:local
    container_name: key-tester

    # WAJIB sejak project ini dipakai sebagai API tester umum, bukan sekadar
    # penguji key cloud. Docker di mesin ini rootless; dalam mode bridge,
    # container tidak bisa menyentuh dev server di host sama sekali (diuji:
    # host.docker.internal:4321 dan 172.17.0.1:4321 dua-duanya connection
    # refused, sementara lewat network host 127.0.0.1:4321 menjawab 200).
    # Dengan network host, "localhost" di dalam container = localhost mesin,
    # jadi request ke http://localhost:3000 dst. bisa diuji dari panel.
    network_mode: host

    # Docker tetap menulis ulang resolv.conf container ke DNS slirp4netns
    # (10.0.2.3) walau memakai network host - alamat itu hanya ada di jaringan
    # bridge rootless. Kembalikan ke stub resolver host, sama seperti
    # ../port-forward dan ../local-web-player.
    dns:
      - ${PANEL_DNS:-127.0.0.53}

    restart: unless-stopped

    # server/index.ts hanya memasang handler SIGINT, sementara `docker stop`
    # mengirim SIGTERM — dan proses PID 1 mengabaikan sinyal yang tidak punya
    # handler, jadi tanpa init setiap stop menunggu 10 detik lalu SIGKILL
    # (terukur: 10,3 s). Dengan init, tini yang jadi PID 1 dan Bun berjalan
    # sebagai child biasa, sehingga SIGTERM kembali mematikan proses seketika.
    init: true

    environment:
      # server/index.ts:154-155 membaca HOST/PORT. Dengan network host, bind ke
      # 127.0.0.1 berarti panel hanya dengar di loopback mesin - itu yang kita
      # mau, karena store.json memuat API key asli dan panel tidak punya auth.
      # Kalau perlu diakses dari luar, tunnel port 8788 lewat ../port-forward.
      HOST: 127.0.0.1
      PORT: 8788
      TZ: ${TZ:-Asia/Jakarta}
      # Tulis balik hasil edit UI ke keys.md (server/core/store.ts:245). Default
      # mati supaya konten bebas di keys.md tidak ketimpa writer. Nyalakan dengan
      # KEYTESTER_MIRROR_MD=1 di environment shell atau ubah default di sini.
      KEYTESTER_MIRROR_MD: ${KEYTESTER_MIRROR_MD:-0}

    volumes:
      # Seluruh folder di-bind karena store.json, history.jsonl, keys.md, dan
      # folder benchmark/ semuanya ditulis relatif ke root project
      # (server/core/store.ts:14) — tidak ada env untuk memindahkannya. Dengan
      # bind ini data tetap hidup di host dan bisa diedit langsung, plus edit
      # kode server cukup `docker compose restart` (Bun baca TS apa adanya).
      - ./:/app
      # Menutupi node_modules host dengan hasil `bun install` dari image.
      # Setelah mengubah package.json:
      #   docker compose build && docker compose up -d --force-recreate
      #   docker volume rm key-tester_node_modules   # bila perlu install ulang
      - node_modules:/app/node_modules

    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8788)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period longgar: boot pertama menjalankan vite build dulu.
      start_period: 60s

volumes:
  node_modules:
